<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WebInsight — DeepSeek AI 网站深度分析</title>

<!-- Markdown 渲染 -->
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js">
</script>

<!-- 代码高亮 -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js">
</script>

<style>
/* ============================================================
   全局重置与变量
   ============================================================ */
*, *::before, *::after {
  margin: 0; padding: 0; box-sizing: border-box;
}

:root {
  --bg-primary: #0a0a0f;
  --bg-secondary: #111118;
  --bg-card: #16162b;
  --bg-input: #1a1a2e;
  --border: #252545;
  --text-primary: #e8e8f0;
  --text-secondary: #9898b8;
  --text-muted: #6868a0;
  --accent-1: #6366f1;
  --accent-2: #8b5cf6;
  --accent-3: #a78bfa;
  --accent-4: #06b6d4;
  --accent-5: #10b981;
  --accent-6: #f59e0b;
  --gradient-1: linear-gradient(135deg, #6366f1 0%, #8b5cf6 50%, #a78bfa 100%);
  --gradient-2: linear-gradient(135deg, #06b6d4 0%, #6366f1 100%);
  --gradient-3: linear-gradient(135deg, #10b981 0%, #06b6d4 100%);
  --gradient-hero: linear-gradient(135deg, #0a0a1a 0%, #1a1050 30%, #0a2240 70%, #0a0a1a 100%);
  --shadow-glow: 0 0 40px rgba(99, 102, 241, 0.15);
  --shadow-card: 0 2px 20px rgba(0,0,0,0.3);
  --radius: 16px;
  --radius-sm: 10px;
  --transition: 0.3s cubic-bezier(0.4,0,0.2,1);
}

html { font-size: 16px; scroll-behavior: smooth; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB',
               'Microsoft YaHei', 'Helvetica Neue', Arial, sans-serif;
  background: var(--bg-primary);
  color: var(--text-primary);
  min-height: 100vh;
  line-height: 1.7;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

/* 背景动画粒子 */
.bg-particles {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  pointer-events: none; z-index: 0;
  background:
    radial-gradient(ellipse 80% 60% at 20% 0%, rgba(99,102,241,0.06) 0%, transparent 60%),
    radial-gradient(ellipse 60% 50% at 80% 100%, rgba(6,182,212,0.05) 0%, transparent 60%),
    radial-gradient(ellipse 50% 40% at 50% 50%, rgba(139,92,246,0.04) 0%, transparent 60%);
}

.bg-grid {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  pointer-events: none; z-index: 0; opacity: 0.4;
  background-image:
    linear-gradient(rgba(99,102,241,0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(99,102,241,0.03) 1px, transparent 1px);
  background-size: 60px 60px;
}

/* ============================================================
   布局
   ============================================================ */
.container {
  max-width: 1100px;
  margin: 0 auto;
  padding: 20px 24px;
  position: relative;
  z-index: 1;
}

/* ============================================================
   Header
   ============================================================ */
.header {
  text-align: center;
  padding: 50px 0 30px;
}

.logo-icon {
  display: inline-block;
  width: 64px; height: 64px;
  background: var(--gradient-1);
  border-radius: 18px;
  display: flex; align-items: center; justify-content: center;
  font-size: 32px;
  margin-bottom: 16px;
  box-shadow: var(--shadow-glow);
  animation: float 3s ease-in-out infinite;
}

@keyframes float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-8px); }
}

.header h1 {
  font-size: 2.2rem;
  font-weight: 800;
  background: var(--gradient-1);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  letter-spacing: -0.5px;
  margin-bottom: 8px;
}

.header .subtitle {
  color: var(--text-secondary);
  font-size: 1rem;
  letter-spacing: 0.5px;
}

/* ============================================================
   输入卡片
   ============================================================ */
.card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 32px;
  margin-bottom: 24px;
  box-shadow: var(--shadow-card);
  backdrop-filter: blur(20px);
  transition: border-color var(--transition);
}

.card:hover { border-color: rgba(99,102,241,0.3); }

/* 输入组 */
.input-group {
  display: flex;
  gap: 12px;
  margin-bottom: 16px;
}

@media (max-width: 768px) {
  .input-group { flex-direction: column; }
}

.input-wrapper {
  position: relative;
  flex: 1;
}

.input-wrapper .icon {
  position: absolute;
  left: 16px; top: 50%;
  transform: translateY(-50%);
  font-size: 18px;
  opacity: 0.6;
  pointer-events: none;
}

input[type="text"],
input[type="password"],
input[type="url"] {
  width: 100%;
  padding: 14px 16px 14px 44px;
  background: var(--bg-input);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--text-primary);
  font-size: 0.95rem;
  font-family: inherit;
  outline: none;
  transition: all var(--transition);
}

input:focus {
  border-color: var(--accent-1);
  box-shadow: 0 0 0 3px rgba(99,102,241,0.15);
}

input::placeholder { color: var(--text-muted); }

/* 按钮 */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 14px 32px;
  border: none;
  border-radius: var(--radius-sm);
  font-size: 0.95rem;
  font-weight: 600;
  font-family: inherit;
  cursor: pointer;
  transition: all var(--transition);
  white-space: nowrap;
  letter-spacing: 0.3px;
}

.btn-primary {
  background: var(--gradient-1);
  color: #fff;
  box-shadow: 0 4px 20px rgba(99,102,241,0.3);
}

.btn-primary:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 30px rgba(99,102,241,0.45);
}

.btn-primary:active { transform: translateY(0); }

.btn-primary:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none;
  box-shadow: none;
}

.btn-secondary {
  background: transparent;
  color: var(--text-secondary);
  border: 1px solid var(--border);
}

.btn-secondary:hover {
  border-color: var(--accent-3);
  color: var(--text-primary);
}

/* 加载动画 */
.spinner {
  display: inline-block;
  width: 18px; height: 18px;
  border: 2px solid rgba(255,255,255,0.3);
  border-top-color: #fff;
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
}

@keyframes spin { to { transform: rotate(360deg); } }

/* ============================================================
   状态指示
   ============================================================ */
.status-bar {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 0;
  font-size: 0.85rem;
  color: var(--text-secondary);
}

.status-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--text-muted);
}

.status-dot.active { background: var(--accent-5); animation: pulse-dot 1.5s ease-in-out infinite; }
.status-dot.error { background: #ef4444; }
.status-dot.done { background: var(--accent-5); }

@keyframes pulse-dot {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.5; transform: scale(1.3); }
}

/* ============================================================
   网站信息概览卡片
   ============================================================ */
.info-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 16px;
  margin-bottom: 24px;
}

.info-item {
  background: var(--bg-input);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 16px;
  transition: all var(--transition);
}

.info-item:hover { border-color: var(--accent-1); }

.info-item .label {
  font-size: 0.75rem;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-bottom: 6px;
}

.info-item .value {
  font-size: 1rem;
  font-weight: 600;
  color: var(--text-primary);
  word-break: break-all;
}

.visual-score-wrap {
  display: grid;
  grid-template-columns: minmax(220px, 300px) 1fr;
  gap: 14px;
  align-items: center;
}

.visual-radar-canvas {
  width: 100%;
  max-width: 300px;
  aspect-ratio: 1;
  background: radial-gradient(circle at 50% 45%, rgba(99, 102, 241, 0.12), transparent 70%);
  border: 1px solid var(--border);
  border-radius: 14px;
}

@media (max-width: 768px) {
  .visual-score-wrap {
    grid-template-columns: 1fr;
  }
}

/* 技术标签 */
.tech-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 4px;
}

.tech-tag {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 3px 10px;
  border-radius: 20px;
  font-size: 0.75rem;
  font-weight: 500;
  background: rgba(99,102,241,0.15);
  color: var(--accent-3);
  border: 1px solid rgba(99,102,241,0.25);
}

.tech-tag.cms { background: rgba(168,85,247,0.15); color: #c084fc; border-color: rgba(168,85,247,0.25); }
.tech-tag.analytics { background: rgba(6,182,212,0.15); color: #22d3ee; border-color: rgba(6,182,212,0.25); }
.tech-tag.server { background: rgba(16,185,129,0.15); color: #34d399; border-color: rgba(16,185,129,0.25); }

/* ============================================================
   报告渲染区
   ============================================================ */
.report-wrapper {
  display: none;
}

.report-wrapper.visible {
  display: block;
  animation: fadeInUp 0.5s ease;
}

@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.report-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 20px;
  flex-wrap: wrap;
  gap: 12px;
}

.report-header h2 {
  font-size: 1.3rem;
  font-weight: 700;
  color: var(--text-primary);
}

.report-actions {
  display: flex;
  gap: 8px;
}

.report-content {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 40px;
  line-height: 1.9;
  color: var(--text-primary);
  box-shadow: var(--shadow-card);
  overflow-x: auto;
}

/* Markdown 内容样式 */
.report-content h1 { font-size: 1.8rem; margin: 32px 0 16px; color: #e8e8f0; border-bottom: 1px solid var(--border); padding-bottom: 12px; }
.report-content h2 { font-size: 1.4rem; margin: 28px 0 12px; color: var(--accent-3); }
.report-content h3 { font-size: 1.15rem; margin: 20px 0 10px; color: var(--accent-4); }
.report-content h4 { font-size: 1rem; margin: 16px 0 8px; color: var(--text-primary); }
.report-content p { margin: 10px 0; }
.report-content ul, .report-content ol { margin: 10px 0; padding-left: 24px; }
.report-content li { margin: 6px 0; }
.report-content strong { color: #fff; font-weight: 700; }
.report-content em { color: var(--accent-3); }
.report-content blockquote {
  border-left: 3px solid var(--accent-1);
  padding: 12px 20px;
  margin: 16px 0;
  background: rgba(99,102,241,0.06);
  border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
  color: var(--text-secondary);
}
.report-content code {
  background: var(--bg-input);
  padding: 2px 8px;
  border-radius: 4px;
  font-size: 0.88em;
  color: var(--accent-4);
}
.report-content pre {
  background: var(--bg-input);
  padding: 20px;
  border-radius: var(--radius-sm);
  overflow-x: auto;
  margin: 16px 0;
  border: 1px solid var(--border);
}
.report-content pre code {
  background: none;
  padding: 0;
  color: var(--text-primary);
}
.report-content table {
  width: 100%;
  border-collapse: collapse;
  margin: 16px 0;
  font-size: 0.9rem;
}
.report-content th {
  background: var(--bg-input);
  padding: 10px 14px;
  text-align: left;
  font-weight: 600;
  color: var(--accent-3);
  border-bottom: 2px solid var(--border);
}
.report-content td {
  padding: 10px 14px;
  border-bottom: 1px solid var(--border);
}
.report-content tr:hover td { background: rgba(99,102,241,0.04); }
.report-content hr { border: none; border-top: 1px solid var(--border); margin: 24px 0; }
.report-content a { color: var(--accent-4); text-decoration: none; }
.report-content a:hover { text-decoration: underline; }
.report-content img { max-width: 100%; border-radius: var(--radius-sm); }

@media (max-width: 768px) {
  .report-content { padding: 24px; }
  .report-content h1 { font-size: 1.4rem; }
  .report-content h2 { font-size: 1.15rem; }
}

/* ============================================================
   加载动画
   ============================================================ */
.loading-overlay {
  display: none;
  text-align: center;
  padding: 60px 20px;
}

.loading-overlay.visible {
  display: block;
  animation: fadeInUp 0.3s ease;
}

.loading-wave {
  display: flex;
  justify-content: center;
  gap: 6px;
  margin-bottom: 20px;
}

.loading-wave span {
  display: block;
  width: 6px; height: 40px;
  background: var(--gradient-1);
  border-radius: 3px;
  animation: wave 1.2s ease-in-out infinite;
}

.loading-wave span:nth-child(1) { animation-delay: 0s; }
.loading-wave span:nth-child(2) { animation-delay: 0.1s; }
.loading-wave span:nth-child(3) { animation-delay: 0.2s; }
.loading-wave span:nth-child(4) { animation-delay: 0.3s; }
.loading-wave span:nth-child(5) { animation-delay: 0.4s; }

@keyframes wave {
  0%, 100% { transform: scaleY(1); opacity: 0.5; }
  50% { transform: scaleY(2); opacity: 1; }
}

.loading-text {
  color: var(--text-secondary);
  font-size: 0.95rem;
}

/* ============================================================
   错误提示
   ============================================================ */
.error-box {
  background: rgba(239,68,68,0.1);
  border: 1px solid rgba(239,68,68,0.3);
  border-radius: var(--radius-sm);
  padding: 16px 20px;
  color: #fca5a5;
  font-size: 0.9rem;
  margin-bottom: 16px;
  display: none;
}

.error-box.visible {
  display: block;
  animation: shake 0.4s ease;
}

@keyframes shake {
  0%, 100% { transform: translateX(0); }
  20% { transform: translateX(-8px); }
  40% { transform: translateX(8px); }
  60% { transform: translateX(-4px); }
  80% { transform: translateX(4px); }
}

/* ============================================================
   Footer
   ============================================================ */
.footer {
  text-align: center;
  padding: 30px 0 50px;
  color: var(--text-muted);
  font-size: 0.8rem;
}

.footer a { color: var(--accent-3); text-decoration: none; }
.footer a:hover { text-decoration: underline; }

/* ============================================================
   提示卡片
   ============================================================ */
.tip-card {
  background: var(--bg-input);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 14px 18px;
  margin-top: 16px;
  font-size: 0.82rem;
  color: var(--text-muted);
  display: flex;
  align-items: flex-start;
  gap: 10px;
}

.tip-card .tip-icon {
  font-size: 1.1rem;
  flex-shrink: 0;
}

.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(2, 6, 23, 0.66);
  z-index: 1200;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 18px;
}

.modal-overlay.show {
  display: flex;
}

.modal-card {
  width: min(960px, 95vw);
  max-height: 86vh;
  overflow: auto;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: 0 20px 44px rgba(0, 0, 0, 0.45);
  padding: 18px;
}

/* 屏幕阅读器可见，视觉隐藏 */
.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  border: 0;
}
</style>
</head>
<body>

<!-- 背景效果 -->
<div class="bg-particles"></div>
<div class="bg-grid"></div>

<!-- ============================================================
     Header
     ============================================================ -->
<div class="container">
  <header class="header">
    <div class="logo-icon">🔍</div>
    <h1>WebInsight</h1>
    <p class="subtitle">DeepSeek AI 驱动的网站深度分析工具</p>
  </header>

  <!-- ============================================================
       输入卡片
       ============================================================ -->
  <div class="card">
    <div class="input-group">
      <div class="input-wrapper">
        <label class="sr-only" for="urlInput">网站 URL</label>
        <span class="icon">🌐</span>
        <input
          type="url"
          id="urlInput"
          placeholder="输入网站 URL，例如 https://example.com"
          autocomplete="url"
        />
      </div>
      <button class="btn btn-primary" id="analyzeBtn" onclick="startAnalyze()">
        <span id="btnText">开始分析</span>
        <span id="btnSpinner" style="display:none" class="spinner"></span>
      </button>
      <button class="btn btn-secondary" onclick="openLocalReportModal()" title="查看本地保存报告">
        🗂 报告列表
      </button>
    </div>

    <div class="input-group" style="margin-bottom:0">
      <div class="input-wrapper">
        <label class="sr-only" for="apiKeyInput">DeepSeek API Key</label>
        <span class="icon">🔑</span>
        <input
          type="password"
          id="apiKeyInput"
          placeholder="可选：DeepSeek API Key（留空则使用服务端配置）"
          autocomplete="off"
        />
      </div>
    </div>

    <div class="input-group" style="gap:12px;align-items:center;margin-top:10px">
      <label style="display:flex;align-items:center;gap:8px;color:var(--text-secondary);font-size:0.84rem">
        <input type="checkbox" id="visionEnabled" checked />
        启用视觉模型（截图分析）
      </label>
      <label style="display:flex;align-items:center;gap:8px;color:var(--text-secondary);font-size:0.84rem">
        交互模拟级别
        <select id="interactionLevel" style="background:var(--bg-card);color:var(--text-primary);border:1px solid var(--border);border-radius:8px;padding:4px 8px">
          <option value="standard" selected>standard</option>
          <option value="basic">basic</option>
          <option value="off">off</option>
        </select>
      </label>
      <label style="display:flex;align-items:center;gap:8px;color:var(--text-secondary);font-size:0.84rem">
        视觉截图数
        <input id="visionMaxImages" type="number" min="1" max="8" value="3" style="width:56px;background:var(--bg-card);color:var(--text-primary);border:1px solid var(--border);border-radius:8px;padding:4px 6px" />
      </label>
      <label style="display:flex;align-items:center;gap:8px;color:var(--text-secondary);font-size:0.84rem">
        <input type="checkbox" id="clickWhitelist" checked />
        点击白名单
      </label>
    </div>

    <div class="tip-card">
      <span class="tip-icon">💡</span>
      <span>
        <strong>API Key 使用说明</strong>：可在此输入临时 Key；若留空，后端会尝试使用服务端环境变量 <code>DEEPSEEK_API_KEY</code>。
      </span>
    </div>
  </div>

  <!-- ============================================================
       错误提示
       ============================================================ -->
  <div class="error-box" id="errorBox"></div>

  <!-- ============================================================
       加载动画
       ============================================================ -->
  <div class="loading-overlay" id="loadingOverlay">
    <div class="loading-wave">
      <span></span><span></span><span></span><span></span><span></span>
    </div>
    <p class="loading-text" id="loadingText">正在抓取网站数据...</p>
  </div>

  <!-- ============================================================
       网站信息概览
       ============================================================ -->
  <div class="info-grid" id="infoGrid" style="display:none"></div>

  <!-- ============================================================
       分析报告
       ============================================================ -->
  <div class="report-wrapper" id="reportWrapper">
    <div class="report-header">
      <h2>📊 分析报告</h2>
      <div class="report-actions">
        <button class="btn btn-secondary" onclick="startAnalyze()" style="font-size:0.8rem">📡 普通</button>
        <button class="btn btn-secondary" onclick="startDebugAnalyze()" style="font-size:0.8rem">🧪 Debug</button>
	        <button class="btn btn-secondary" onclick="saveReportToLocal()" title="保存到本地 IndexedDB">
          💾 保存报告
        </button>
	        <button class="btn btn-secondary" onclick="downloadAlertSummary()" title="下载变化告警 JSON">
          🚨 下载告警
        </button>
	        <button class="btn btn-secondary" onclick="copyReport()" title="复制报告">
          📋 复制
        </button>
        <button class="btn btn-secondary" onclick="downloadReport()" title="下载 Markdown">
          📥 下载 .md
        </button>
      </div>
    </div>
    <div class="report-content" id="reportContent"></div>
  </div>

  <div id="localReportModal" class="modal-overlay" aria-hidden="true" onclick="onLocalReportModalMaskClick(event)">
    <div class="modal-card" id="localReportPanel" role="dialog" aria-modal="true" aria-labelledby="localReportTitle">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:12px">

let currentReport = '';

let currentAlertSummary = null;
let highlightedLocalReportId = null;
const LOCAL_REPORT_DB = 'webinsight-local-reports';
const LOCAL_REPORT_STORE = 'reports';

const $ = (id) => document.getElementById(id);

function openLocalReportDb() {
  return new Promise((resolve, reject) => {
    if (!window.indexedDB) {
      reject(new Error('当前浏览器不支持 IndexedDB'));
      return;
    }
    const request = window.indexedDB.open(LOCAL_REPORT_DB, 1);
    request.onupgradeneeded = (event) => {
      const db = event.target.result;
      if (!db.objectStoreNames.contains(LOCAL_REPORT_STORE)) {
        const store = db.createObjectStore(LOCAL_REPORT_STORE, { keyPath: 'id', autoIncrement: true });
        store.createIndex('saved_at', 'saved_at', { unique: false });
      }
    };
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error || new Error('IndexedDB 打开失败'));
  });
}

function openLocalReportModal() {
  const modal = $('localReportModal');
  if (!modal) return;
  modal.classList.add('show');
  modal.setAttribute('aria-hidden', 'false');
  loadLocalReports();
}

function closeLocalReportModal() {
  const modal = $('localReportModal');
  if (!modal) return;
  modal.classList.remove('show');
  modal.setAttribute('aria-hidden', 'true');
}

function onLocalReportModalMaskClick(event) {
  if (event.target && event.target.id === 'localReportModal') {
    closeLocalReportModal();

}

async function saveReportToLocal() {
  if (!currentReport || !currentReport.trim()) {
    showToast('⚠️ 当前没有可保存的报告');
    return;
  }
  try {
    const db = await openLocalReportDb();
    let savedId = null;
    await new Promise((resolve, reject) => {
      const tx = db.transaction([LOCAL_REPORT_STORE], 'readwrite');
      const store = tx.objectStore(LOCAL_REPORT_STORE);
      const now = new Date();
      const req = store.add({
        title: currentWebsiteData?.title || '',
        domain: currentWebsiteData?.domain || '',
        saved_at: now.toISOString(),
        saved_at_ts: now.getTime(),
        report: currentReport,
        website_data: currentWebsiteData || null,
      });
      req.onsuccess = () => {
        savedId = Number(req.result);
      };
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error || new Error('保存失败'));
      tx.onabort = () => reject(tx.error || new Error('保存被中止'));
    });
    db.close();
    highlightedLocalReportId = savedId;
    openLocalReportModal();
    await loadLocalReports();
    showToast('💾 已保存到本地 IndexedDB');
  } catch (err) {
    showToast('❌ 保存失败: ' + (err.message || err));
  }
}

async function loadLocalReports() {
  const list = $('localReportList');
  if (!list) return;
  const keyword = (($('localReportKeyword')?.value || '').trim().toLowerCase());
  list.innerHTML = '<span style="color:var(--text-muted)">加载中...</span>';
  try {
    const db = await openLocalReportDb();
    const rows = await new Promise((resolve, reject) => {
      const tx = db.transaction([LOCAL_REPORT_STORE], 'readonly');
      const store = tx.objectStore(LOCAL_REPORT_STORE);
      const req = store.getAll();
      req.onsuccess = () => resolve(req.result || []);
      req.onerror = () => reject(req.error || new Error('读取失败'));
    });
    db.close();

    rows.sort((a, b) => Number(b.saved_at_ts || 0) - Number(a.saved_at_ts || 0));
    const filtered = keyword
      ? rows.filter((item) => {
          const domain = String(item.domain || '').toLowerCase();
          const title = String(item.title || '').toLowerCase();
          return domain.includes(keyword) || title.includes(keyword);
        })
      : rows;

    if (!filtered.length) {
      list.innerHTML = '<span style="color:var(--text-muted)">当前暂无本地保存报告</span>';
      return;
    }

    list.innerHTML = filtered.map((item) => {
      const name = item.domain || item.title || '未命名报告';
      const time = item.saved_at ? new Date(item.saved_at).toLocaleString() : '未知时间';
      const preview = (item.report || '').replace(/\s+/g, ' ').slice(0, 110);
      const isHighlighted = Number(item.id) === Number(highlightedLocalReportId);
      return `
        <div data-local-report-id="${Number(item.id)}" style="padding:10px 0;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:flex-start;gap:10px;${isHighlighted ? 'background:rgba(16,185,129,0.12);border-radius:8px;padding:10px 8px;' : ''}">
          <div style="flex:1;cursor:pointer" onclick="loadLocalReportItem(${Number(item.id)})">
            <div style="color:var(--text-primary);font-weight:600;margin-bottom:3px">${escapeHtml(name)}${isHighlighted ? '<span style="margin-left:8px;font-size:0.68rem;color:var(--accent-5)">刚保存</span>' : ''}</div>
            <div style="color:var(--text-muted);font-size:0.72rem;margin-bottom:4px">${escapeHtml(time)}</div>
            <div style="color:var(--text-secondary);font-size:0.75rem;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;max-width:600px">${escapeHtml(preview)}${preview.length >= 110 ? '…' : ''}</div>
          </div>
          <div style="display:flex;gap:6px;flex-shrink:0">
            <button onclick="event.stopPropagation();loadLocalReportItem(${Number(item.id)})" style="background:none;border:1px solid var(--border);color:var(--text-secondary);border-radius:6px;padding:3px 8px;cursor:pointer;font-size:0.7rem">查看</button>
            <button onclick="event.stopPropagation();deleteLocalReportItem(${Number(item.id)})" style="background:none;border:1px solid var(--border);color:#fca5a5;border-radius:6px;padding:3px 8px;cursor:pointer;font-size:0.7rem">删除</button>
          </div>
        </div>`;
    }).join('');

    if (highlightedLocalReportId) {
      const focusEl = list.querySelector(`[data-local-report-id="${Number(highlightedLocalReportId)}"]`);
      if (focusEl && focusEl.scrollIntoView) {
        focusEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }
    }
  } catch (err) {
    list.innerHTML = `<span style="color:#f87171">加载失败: ${escapeHtml(err.message || String(err))}</span>`;
  }
}

async function clearAllLocalReports() {

      const tx = db.transaction([LOCAL_REPORT_STORE], 'readwrite');

      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error || new Error('清空失败'));

async function loadLocalReportItem(id) {

async function deleteLocalReportItem(id) {

function getFriendlyApiError(status, detail) {
  const msg = (detail || '').toString().trim();
  if (status === 401) return msg || '认证失败：API Key 无效或无权限，请检查后重试';
  if (status === 402) return msg || '账户额度不足：请检查 DeepSeek 计费与配额';
  if (status === 429) return msg || '请求过于频繁：请稍后再试';
  if (status === 400) return msg || '请求参数错误，请检查 URL / 参数后重试';
  if (status >= 500) return msg || '服务暂时异常，请稍后重试';
  return msg || ('请求失败 (' + status + ')');
}

async function startAnalyzeStream() {
  const url = $('urlInput').value.trim();
  const apiKey = $('apiKeyInput').value.trim();
  const opts = getAnalyzeOptions();

  if (!url) { showError('请输入网站 URL'); $('urlInput').focus(); return; }
  if (apiKey && !apiKey.startsWith('sk-')) { showError('API Key 格式不正确，应以 sk- 开头'); return; }
  hideError(); hideReport(); hideInfoGrid(); hideDebugPanel();
  showLoading('正在抓取网站数据...');

  const btn = $('analyzeBtn');
  btn.disabled = true;
  $('btnText').textContent = '分析中...';
  $('btnSpinner').style.display = 'inline-block';

  try {
    updateLoadingText('正在抓取网站数据...');
    const response = await fetch('/api/analyze/stream', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        url,
        api_key: apiKey,
        model: 'deepseek-chat',
        enable_vision: opts.enable_vision,
        interaction_level: opts.interaction_level,
        vision_max_images: opts.vision_max_images,
        click_whitelist: opts.click_whitelist,
      })
    });

    if (!response.ok) {
      const errData = await response.json().catch(() => ({}));
      throw new Error(getFriendlyApiError(response.status, errData.detail));
    }

    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';
    let reportText = '';
    let metaReceived = false;

    $('reportWrapper').classList.add('visible');
    $('reportContent').innerHTML = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;

      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop() || '';

      for (const line of lines) {
        if (line.startsWith('event: done')) break;
        if (line.startsWith('event: error')) {
          try {
            const data = JSON.parse(line.replace('data: ', ''));
            throw new Error(data.error);
          } catch(e) { if (e.message !== 'data: ') throw e; }
        }
        if (line.startsWith('data: ') && line.indexOf('"content"') > -1) {
          try {
            const data = JSON.parse(line.replace('data: ', ''));
            reportText += data.content;
            $('reportContent').innerHTML = marked.parse(reportText);
            $('reportContent').querySelectorAll('pre code').forEach(function(block) { hljs.highlightElement(block); });
          } catch(e) {}
        }
        if (line.startsWith('data: ') && line.indexOf('"title"') > -1) {
          try {
            const meta = JSON.parse(line.replace('data: ', ''));
            currentWebsiteData = meta;
            renderInfoGrid(meta);
            metaReceived = true;
            updateLoadingText('DeepSeek AI 正在实时分析中...');
            hideLoading();
          } catch(e) {}
        }
      }
    }

    currentReport = reportText;
    if (!metaReceived) hideLoading();

  } catch (err) {
    showError(err.message);
    hideLoading();
  } finally {
    btn.disabled = false;
    $('btnText').textContent = '开始分析';
    $('btnSpinner').style.display = 'none';
  }
}

async function startAnalyze() {
  const url = $('urlInput').value.trim();
  const apiKey = $('apiKeyInput').value.trim();
  const opts = getAnalyzeOptions();

  // 校验
  if (!url) {
    showError('请输入网站 URL');
    $('urlInput').focus();
    return;
  }
  if (apiKey && !apiKey.startsWith('sk-')) {
    showError('API Key 格式不正确，应以 sk- 开头');
    return;
  }

  // 重置 UI
  hideError();
  hideReport();
  hideInfoGrid();
  hideDebugPanel();
  showLoading('正在抓取网站数据...');

  // 禁用按钮
  const btn = $('analyzeBtn');
  btn.disabled = true;
  $('btnText').textContent = '分析中...';
  $('btnSpinner').style.display = 'inline-block';

  try {
    // 调用后端 API
    updateLoadingText('正在抓取网站数据...');
    const response = await fetch('/api/analyze', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        url: url,
        api_key: apiKey,
        model: 'deepseek-chat',
        enable_vision: opts.enable_vision,
        interaction_level: opts.interaction_level,
        vision_max_images: opts.vision_max_images,
        click_whitelist: opts.click_whitelist,
      })
    });

    if (!response.ok) {
      const errData = await response.json().catch(() => ({}));
      throw new Error(getFriendlyApiError(response.status, errData.detail));
    }

    updateLoadingText('🤖 DeepSeek AI 正在深度分析中，请耐心等待...（通常需要 20-60 秒）');

    const data = await response.json();

    if (!data.success) {
      throw new Error(data.error || '分析失败');
    }

    // 显示信息概览
    currentWebsiteData = data.website_data;
    renderInfoGrid(data.website_data);

    // 渲染报告
    currentReport = data.report;
    renderReport(data.report);

    // 滚动到报告区域
    setTimeout(() => {
      $('reportWrapper').scrollIntoView({ behavior: 'smooth', block: 'start' });
    }, 200);

  } catch (err) {
    showError(err.message);
  } finally {
    hideLoading();
    btn.disabled = false;
    $('btnText').textContent = '开始分析';
    $('btnSpinner').style.display = 'none';
  }
}

function renderDebugPanel(data) {
  const wrapper = $('debugWrapper');
  const content = $('debugContent');
  const dbg = data.tech_detection_debug || {};
  const rawTech = dbg.raw_tech_stack || {};
  const finalTech = dbg.tech_stack || {};

  const suppressions = dbg.suppressions || [];
  const arch = data.architecture_hints || {};
  const rows = data.evidence_rows || [];
  const animEvidence = data.animation_evidence || {};
  const animRows = data.animation_evidence_rows || [];
  const gsapProfile = data.gsap_profile || {};

  const html = [];
  html.push('<h3>架构推断</h3>');
  html.push('<pre><code class="language-json">' + escapeHtml(JSON.stringify(arch, null, 2)) + '</code></pre>');

  html.push('<h3>技术栈（抑制前）</h3>');
  html.push('<pre><code class="language-json">' + escapeHtml(JSON.stringify(rawTech, null, 2)) + '</code></pre>');

  html.push('<h3>技术栈（抑制后）</h3>');
  html.push('<pre><code class="language-json">' + escapeHtml(JSON.stringify(finalTech, null, 2)) + '</code></pre>');

  html.push('<pre><code class="language-json">' + escapeHtml(JSON.stringify(suppressions, null, 2)) + '</code></pre>');

  html.push('<h3>结论证据行</h3>');
  html.push('<pre><code class="language-json">' + escapeHtml(JSON.stringify(rows, null, 2)) + '</code></pre>');

  html.push('<h3>动画证据摘要</h3>');
  html.push('<pre><code class="language-json">' + escapeHtml(JSON.stringify(animEvidence, null, 2)) + '</code></pre>');

  html.push('<h3>动画证据明细行 (' + animRows.length + ')</h3>');
  html.push('<pre><code class="language-json">' + escapeHtml(JSON.stringify(animRows.slice(0, 80), null, 2)) + '</code></pre>');

  html.push('<h3>GSAP 实现方案画像</h3>');
  html.push('<pre><code class="language-json">' + escapeHtml(JSON.stringify(gsapProfile, null, 2)) + '</code></pre>');

  content.innerHTML = html.join('');
  content.querySelectorAll('pre code').forEach((block) => hljs.highlightElement(block));

  wrapper.style.display = 'block';
  wrapper.classList.add('visible');
  setTimeout(() => wrapper.scrollIntoView({ behavior: 'smooth', block: 'start' }), 100);
}

// ============================================================
//  信息概览渲染
// ============================================================
function renderInfoGrid(data) {
  if (!data) return;

  currentAlertSummary = data.alert_summary || null;

  const grid = $('infoGrid');
  grid.style.display = 'grid';

  let items = '';
  const visualScorecard = data.visual_scorecard || null;

  // 网站标题 + Meta描述
  if (data.title) {
    items += `<div class="info-item">
      <div class="label">📌 网站标题</div>
      <div class="value">${escapeHtml(data.title)}</div>
      ${data.meta_description ? `<div style="margin-top:6px;font-size:0.78rem;color:var(--text-muted);line-height:1.4">${escapeHtml(data.meta_description.slice(0, 150))}${data.meta_description.length > 150 ? '...' : ''}</div>` : '<div style="margin-top:4px;font-size:0.72rem;color:#ef4444">缺少 Meta Description</div>'}
    </div>`;
  }

  // 域名
  if (data.domain) {
    items += `<div class="info-item">
      <div class="label">🌍 域名</div>
      <div class="value">${escapeHtml(data.domain)}</div>
    </div>`;
  }

  // OG 图片预览
  if (data.og_image) {
    items += `<div class="info-item">
      <div class="label">🖼 Open Graph 图片</div>
      <div style="margin-top:6px;border-radius:8px;overflow:hidden;border:1px solid var(--border)">
        <img src="${escapeHtml(data.og_image)}" alt="Open Graph preview" style="width:100%;max-height:120px;object-fit:cover" onerror="this.style.display='none'" />
      </div>
    </div>`;
  } else if (data.og_title) {
    items += `<div class="info-item">
      <div class="label">🔖 Open Graph 标题</div>
      <div class="value">${escapeHtml(data.og_title)}</div>
    </div>`;
  }

  // 页面统计
  if (data.page_stats) {
    const stats = data.page_stats;
    let statsHtml = `${stats.html_size_kb || 0} KB · ${stats.div_count || 0} div · ${stats.image_count || 0} 图片`;
    if (stats.link_count !== undefined) statsHtml += ` · ${stats.link_count} 链接`;
    if (stats.section_count) statsHtml += ` · ${stats.section_count} section`;
    if (stats.form_count) statsHtml += ` · ${stats.form_count} 表单`;
    if (stats.button_count) statsHtml += ` · ${stats.button_count} 按钮`;
    if (stats.video_count) statsHtml += ` · ${stats.video_count} 视频`;
    if (stats.canvas_count) statsHtml += ` · ${stats.canvas_count} Canvas`;
    if (stats.svg_count) statsHtml += ` · ${stats.svg_count} SVG`;

    // 模块数量（Playwright 特有）
    if (data.module_count !== undefined) {
      statsHtml += `<br><span style="font-size:0.78rem;color:var(--accent-4);font-weight:600">🧩 检测到 <strong>${data.module_count}</strong> 个页面模块</span>`;
    }

    // 数据来源
    if (data.source) {
      const sourceLabel = data.source === 'playwright'
        ? '<span style="color:var(--accent-5)">🌐 Playwright 动态渲染</span>'
        : '<span style="color:var(--text-muted)">📄 HTTP 静态抓取</span>';
      statsHtml += ` · ${sourceLabel}`;
    }

    // 语义化标签
    if (stats.semantic_tags_used && Object.keys(stats.semantic_tags_used).length > 0) {
      const semTags = Object.entries(stats.semantic_tags_used).map(([k, v]) => `\`<${k}>\` ×${v}`).join(', ');
      statsHtml += `<br><span style="font-size:0.72rem;color:var(--accent-4)">语义标签: ${semTags}</span>`;
    } else {
      statsHtml += `<br><span style="font-size:0.72rem;color:#ef4444">无语义化标签</span>`;
    }

    // 现代图片格式
    if (stats.modern_image_formats) {
      const mi = stats.modern_image_formats;
      const formats = [];
      if (mi.webp) formats.push(`WebP ×${mi.webp}`);
      if (mi.avif) formats.push(`AVIF ×${mi.avif}`);
      if (mi.svg) formats.push(`SVG ×${mi.svg}`);
      if (formats.length > 0) {
        statsHtml += `<br><span style="font-size:0.72rem;color:var(--accent-5)">图片格式: ${formats.join(', ')}</span>`;
      }
    }

    items += `<div class="info-item" style="grid-column: 1 / -1">
      <div class="label">📐 页面规模</div>
      <div class="value" style="font-size:0.88rem">${statsHtml}</div>
    </div>`;
  }

  // 技术栈
  if (data.tech_stack) {
    const tech = data.tech_stack;
    let allTech = [];

    // 构建工具
    if (tech.build_tools && tech.build_tools.length > 0) {
      allTech = allTech.concat(tech.build_tools.map(t => `<span class="tech-tag">🔧 ${t}</span>`));
    }
    // 前端框架
    if (tech.frameworks && tech.frameworks.length > 0) {
      allTech = allTech.concat(tech.frameworks.map(t => `<span class="tech-tag">⚛️ ${t}</span>`));
    }
    // JS 库
    if (tech.libraries && tech.libraries.length > 0) {
      allTech = allTech.concat(tech.libraries.map(t => `<span class="tech-tag">📚 ${t}</span>`));
    }
    // 动画库（高亮显示）
    if (tech.animation_libraries && tech.animation_libraries.length > 0) {
      allTech = allTech.concat(tech.animation_libraries.map(t => `<span class="tech-tag" style="background:rgba(34,197,94,0.2);color:#4ade80;border-color:rgba(34,197,94,0.35);font-weight:700">🎬 ${t}</span>`));
    }
    // CSS 框架
    if (tech.css_framework && tech.css_framework.length > 0) {
      allTech = allTech.concat(tech.css_framework.map(t => `<span class="tech-tag" style="background:rgba(236,72,153,0.15);color:#f472b6;border-color:rgba(236,72,153,0.25)">🎨 ${t}</span>`));
    }
    // CMS
    if (tech.cms && tech.cms.length > 0) {
      allTech = allTech.concat(tech.cms.map(t => `<span class="tech-tag cms">📦 ${t}</span>`));
    }
    // 分析工具
    if (tech.analytics && tech.analytics.length > 0) {
      allTech = allTech.concat(tech.analytics.map(t => `<span class="tech-tag analytics">📊 ${t}</span>`));
    }
    // CDN
    if (tech.cdn && tech.cdn.length > 0) {
      allTech = allTech.concat(tech.cdn.map(t => `<span class="tech-tag" style="background:rgba(6,182,212,0.15);color:#22d3ee;border-color:rgba(6,182,212,0.25)">⚡ ${t}</span>`));
    }
    // 服务器
    if (tech.server && tech.server.length > 0) {
      allTech = allTech.concat(tech.server.map(t => `<span class="tech-tag server">🖥 ${t}</span>`));
    }
    // 托管
    if (tech.hosting && tech.hosting.length > 0) {
      allTech = allTech.concat(tech.hosting.map(t => `<span class="tech-tag" style="background:rgba(245,158,11,0.15);color:#fbbf24;border-color:rgba(245,158,11,0.25)">☁️ ${t}</span>`));
    }
    // 字体
    if (tech.fonts && tech.fonts.length > 0) {
      allTech = allTech.concat(tech.fonts.map(t => `<span class="tech-tag" style="background:rgba(139,92,246,0.15);color:#c084fc;border-color:rgba(139,92,246,0.25)">🔤 ${t}</span>`));
    }

    if (allTech.length > 0) {
      items += `<div class="info-item" style="grid-column: 1 / -1">
        <div class="label">🛠️ 检测到的技术栈 (${allTech.length}项)</div>
        <div class="tech-tags">${allTech.join('')}</div>
      </div>`;
    }
  }

  // 🧠 架构推断提示（带置信度）
  if (data.architecture_hints) {
    const ah = data.architecture_hints;
    const c = Number(ah.mixed_architecture_confidence || 0);
    const cColor = c >= 0.7 ? 'var(--accent-5)' : c >= 0.4 ? 'var(--accent-6)' : '#ef4444';
    const mixed = ah.likely_mixed_architecture ? '是' : '否';
    items += `<div class="info-item" style="grid-column: 1 / -1">
      <div class="label">🧠 架构推断提示</div>
      <div class="value" style="font-size:0.8rem;line-height:1.6">
        混合架构：<strong>${mixed}</strong> · 置信度：<span style="color:${cColor};font-weight:700">${c.toFixed(2)}</span><br>
        Next.js 信号：${ah.nextjs_signals || 0} · Webflow 信号：${ah.webflow_signals || 0}<br>
        <span style="font-size:0.72rem;color:var(--text-muted)">${escapeHtml(ah.instruction || '')}</span>
      </div>
    </div>`;
  }

  // 🚨 变化告警摘要（同域名连续分析）
  if (data.alert_summary) {
    const alert = data.alert_summary;
    const sev = alert.severity || 'low';
    const score = Number(alert.change_score || 0);
    const sevColor = sev === 'high' ? '#ef4444' : sev === 'medium' ? 'var(--accent-6)' : 'var(--accent-5)';
    const m = alert.metrics || {};
    const sizeDelta = (m.html_size_kb && m.html_size_kb.delta_pct !== undefined)
      ? (Number(m.html_size_kb.delta_pct) * 100).toFixed(1) + '%'
      : 'N/A';
    const moduleDelta = (m.module_count && m.module_count.delta !== undefined)
      ? String(m.module_count.delta)
      : 'N/A';
    const techChangeTotal = (alert.tech_stack_changes && alert.tech_stack_changes.total !== undefined)
      ? String(alert.tech_stack_changes.total)
      : '0';
    const added = (alert.tech_stack_changes && Array.isArray(alert.tech_stack_changes.added))
      ? alert.tech_stack_changes.added
      : [];
    const removed = (alert.tech_stack_changes && Array.isArray(alert.tech_stack_changes.removed))
      ? alert.tech_stack_changes.removed
      : [];
    const detailHtml = `
      <details style="margin-top:8px">
        <summary style="cursor:pointer;color:var(--text-secondary)">查看技术栈变更明细</summary>
        <div style="margin-top:6px;font-size:0.76rem;color:var(--text-muted)">
          <div><strong style="color:var(--accent-5)">新增:</strong> ${added.length ? escapeHtml(added.join(', ')) : '无'}</div>
          <div style="margin-top:4px"><strong style="color:#ef4444">移除:</strong> ${removed.length ? escapeHtml(removed.join(', ')) : '无'}</div>
        </div>
      </details>
    `;

    items += `<div class="info-item" style="grid-column: 1 / -1">
      <div class="label">🚨 变化告警摘要</div>
      <div class="value" style="font-size:0.82rem;line-height:1.6">
        级别：<span style="color:${sevColor};font-weight:700">${escapeHtml(sev)}</span>
        · 分数：<strong>${score.toFixed(3)}</strong>
        · 阈值：${Number(alert.threshold || 0).toFixed(2)}<br>
        HTML 体积变化：${escapeHtml(sizeDelta)} · 模块变化：${escapeHtml(moduleDelta)} · 技术栈变动项：${escapeHtml(techChangeTotal)}
        ${detailHtml}
      </div>
    </div>`;
  }

  // 👁️ 视觉与交互采样摘要
  if (data.interaction_summary || data.visual_snapshot_count !== undefined) {
    const it = data.interaction_summary || {};
    const level = it.level || 'off';
    const stepCount = it.total_steps || 0;
    const shotCount = Number(data.visual_snapshot_count || 0);
    const visionEnabled = data.vision_enabled === undefined ? 'N/A' : (data.vision_enabled ? 'on' : 'off');
    const visionMaxImages = data.vision_max_images !== undefined ? String(data.vision_max_images) : 'N/A';
    const clickWhitelist = data.click_whitelist === undefined ? 'N/A' : (data.click_whitelist ? 'on' : 'off');
    items += `<div class="info-item" style="grid-column: 1 / -1">
      <div class="label">👁️ 视觉与交互采样</div>
      <div class="value" style="font-size:0.82rem;line-height:1.6">
        交互级别：<strong>${escapeHtml(level)}</strong> · 交互步骤：${escapeHtml(String(stepCount))} · 截图数量：${escapeHtml(String(shotCount))}<br>
        视觉模型：${escapeHtml(visionEnabled)} · 视觉截图上限：${escapeHtml(visionMaxImages)} · 点击白名单：${escapeHtml(clickWhitelist)}
      </div>
    </div>`;
  }

  // 🎬 运行时动画数据
  if (data.runtime_animation && Object.keys(data.runtime_animation).length > 0) {
    const ra = data.runtime_animation;
    let animLines = [];
    if (ra.gsap_version) animLines.push(`GSAP v${ra.gsap_version}`);
    if (ra.plugins && ra.plugins.length > 0) animLines.push(`插件: ${ra.plugins.join(', ')}`);
    if (ra.scrolltrigger_instances !== undefined) animLines.push(`ScrollTrigger: ${ra.scrolltrigger_instances} 个实例`);
    if (ra.total_animated_elements !== undefined) animLines.push(`CSS Animation 元素: ${ra.total_animated_elements} 个`);
    if (ra.total_transform_elements !== undefined) animLines.push(`Transform 元素: ${ra.total_transform_elements} 个`);
    if (ra.total_will_change_elements !== undefined) animLines.push(`will-change 元素: ${ra.total_will_change_elements} 个`);
    if (ra.waapi_animation_count !== undefined) animLines.push(`WAAPI 实例: ${ra.waapi_animation_count}`);
    if (ra.transition_all_elements !== undefined) animLines.push(`transition:all 元素: ${ra.transition_all_elements}`);
    if (ra.non_composited_transition_elements !== undefined) animLines.push(`非合成过渡风险元素: ${ra.non_composited_transition_elements}`);
    if (ra.scroll_signal_elements !== undefined) animLines.push(`滚动信号元素: ${ra.scroll_signal_elements}`);
    if (ra.parallax_hint_elements !== undefined) animLines.push(`视差线索元素: ${ra.parallax_hint_elements}`);
    if (ra.lenis_detected !== undefined) animLines.push(`Lenis 运行时: ${ra.lenis_detected ? '✓' : '×'}`);
    if (ra.lottie) animLines.push(`Lottie: ✓`);
    if (ra.lottie_elements !== undefined) animLines.push(`Lottie 相关元素: ${ra.lottie_elements}`);
    if (ra.video_elements !== undefined) animLines.push(`Video 元素: ${ra.video_elements}`);
    if (ra.three_version) animLines.push(`Three.js r${ra.three_version}`);
    if (ra.smooth_scroll) animLines.push(`平滑滚动: ✓`);

    if (animLines.length > 0) {
      items += `<div class="info-item" style="grid-column: 1 / -1">
        <div class="label">🎬 运行时动画检测</div>
        <div class="value" style="font-size:0.82rem;color:var(--accent-5)">${animLines.join(' | ')}</div>
      </div>`;
    }
  }

  // 🧭 GSAP 实现方案画像
  if (data.gsap_profile && data.gsap_profile.gsap_detected) {
    const gp = data.gsap_profile;
    const cc = gp.call_counts || {};
    const st = gp.scrolltrigger_profile || {};
    const tm = gp.tween_mix || {};
    const hs = (gp.trigger_hotspots || []).slice(0, 3);
    const hsHtml = hs.length
      ? `<br><span style="font-size:0.74rem;color:var(--text-muted)">高频触发点: ${hs.map(h => escapeHtml((h.selector || 'unknown') + '×' + Number(h.count || 0))).join(' / ')}</span>`
      : '';
    const acts = (gp.optimization_actions || []).slice(0, 3);
    const actsHtml = acts.length
      ? `<br><span style="font-size:0.74rem;color:var(--text-secondary)">建议: ${acts.map(x => escapeHtml(x)).join('；')}</span>`
      : '';
    items += `<div class="info-item" style="grid-column: 1 / -1">
      <div class="label">🧭 GSAP 实现方案画像</div>
      <div class="value" style="font-size:0.8rem;line-height:1.7">
        风格：<strong>${escapeHtml(gp.implementation_style || 'unknown')}</strong> · 场景：<strong>${escapeHtml(gp.scenario_profile || 'balanced')}</strong> · 版本：${escapeHtml(gp.gsap_version || 'unknown')}<br>
        Tween：to=${Number(cc.gsap_to || 0)} / from=${Number(cc.gsap_from || 0)} / fromTo=${Number(cc.gsap_fromto || 0)} / timeline=${Number(cc.gsap_timeline || 0)}<br>
        结构占比：to=${Number(tm.to_ratio || 0).toFixed(3)} · from=${Number(tm.from_ratio || 0).toFixed(3)} · fromTo=${Number(tm.fromto_ratio || 0).toFixed(3)}<br>
        ScrollTrigger：instances=${Number(st.instances || 0)} · scrub=${Number(st.with_scrub || 0)} · pin=${Number(st.with_pin || 0)} · scrub+pin=${Number(st.scrub_pin_combo || 0)} · snap=${Number(st.with_snap || 0)} · toggleActions=${Number(st.with_toggle_actions || 0)}<br>
        Start分布：top-top=${Number(st.start_top_top || 0)} · top-bottom=${Number(st.start_top_bottom || 0)} · top-center=${Number(st.start_top_center || 0)} · other=${Number(st.start_other || 0)}<br>
        End分布：+=x=${Number(st.end_plus_eq || 0)} · bottom-top=${Number(st.end_bottom_top || 0)} · other=${Number(st.end_other || 0)}<br>
        页面分层：首屏=${Number(st.above_fold || 0)} · 中段=${Number(st.mid_fold || 0)} · 深层=${Number(st.deep_fold || 0)}
        ${hsHtml}
        ${actsHtml}
      </div>
    </div>`;
  }

  // 🎬 动画库证据置信度
  if (data.animation_evidence && Array.isArray(data.animation_evidence.libraries) && data.animation_evidence.libraries.length > 0) {
    const libs = data.animation_evidence.libraries.slice(0, 10);
    const libLines = libs.map((it) => {
      const c = Number(it.confidence || 0);
      const color = c >= 0.75 ? 'var(--accent-5)' : c >= 0.5 ? 'var(--accent-6)' : '#f87171';
      const paths = (it.evidence_paths || []).slice(0, 3).join(', ') || '无';
      const urls = (it.script_hit_urls || []).slice(0, 3);
      const risk = (it.false_positive_risk || 'medium').toLowerCase();
      const riskColor = risk === 'high' ? '#f87171' : (risk === 'low' ? 'var(--accent-5)' : 'var(--accent-6)');
      const urlHtml = urls.length
        ? `<details style="margin-top:3px"><summary style="cursor:pointer;color:var(--text-secondary)">脚本证据(${urls.length})</summary><div style="margin-top:3px;font-size:0.72rem;color:var(--text-muted)">${urls.map(u => escapeHtml(u)).join('<br>')}</div></details>`
        : '';
      return `<div style="margin-bottom:6px">
        <strong style="color:${color}">${escapeHtml(it.library || '')}</strong>
        <span style="color:var(--text-secondary)"> (${escapeHtml(it.level || '')}, ${c.toFixed(2)})</span>
        <span style="margin-left:6px;font-size:0.7rem;color:${riskColor}">误报风险:${escapeHtml(risk)}</span><br>
        <span style="font-size:0.72rem;color:var(--text-muted)">证据: ${escapeHtml(paths)}</span>
        ${urlHtml}
      </div>`;
    }).join('');
    items += `<div class="info-item" style="grid-column: 1 / -1">
      <div class="label">🎬 动画库识别置信度</div>
      <div class="value" style="font-size:0.8rem;line-height:1.6">${libLines}</div>
    </div>`;
  }

  // 🚀 Lighthouse 性能数据 (v2.0)
  if (data.performance && !data.performance.error) {
    const perf = data.performance;
    let perfHtml = '';
    if (perf.performance_score !== undefined) {
      const pColor = perf.performance_score >= 90 ? 'var(--accent-5)' : perf.performance_score >= 50 ? 'var(--accent-6)' : '#ef4444';
      perfHtml += `<span style="color:${pColor};font-weight:700">⚡ Performance: ${perf.performance_score}/100</span>`;
    }
    if (perf.seo_score !== undefined) perfHtml += ` · <span style="color:var(--accent-4)">🔍 SEO: ${perf.seo_score}/100</span>`;
    if (perf.accessibility_score !== undefined) perfHtml += ` · <span style="color:var(--accent-3)">♿ A11y: ${perf.accessibility_score}/100</span>`;
    if (perf.lcp) perfHtml += `<br><span style="font-size:0.72rem;color:var(--text-muted)">LCP: ${(perf.lcp/1000).toFixed(1)}s · CLS: ${(perf.cls||0).toFixed(3)} · TBT: ${perf.tbt?(perf.tbt/1000).toFixed(1)+'s':'N/A'}</span>`;
    if (perf.non_composited_animations && perf.non_composited_animations.length > 0) {
      perfHtml += `<br><span style="font-size:0.72rem;color:#ef4444">⚠ 非合成动画: ${perf.non_composited_animations.length} 个</span>`;
    }
    items += `<div class="info-item" style="grid-column: 1 / -1">
      <div class="label">🚀 Lighthouse 性能审计 (v2)</div>
      <div class="value" style="font-size:0.82rem">${perfHtml}</div>
    </div>`;
  }

  // 👁️ 视觉评分雷达图（纯 CSS + JS）
  if (visualScorecard && visualScorecard.available && visualScorecard.mapped_scores) {
    const mapped = visualScorecard.mapped_scores;
    const findings = Array.isArray(visualScorecard.findings) ? visualScorecard.findings.slice(0, 2) : [];
    const risks = Array.isArray(visualScorecard.risks) ? visualScorecard.risks.slice(0, 2) : [];
    items += `<div class="info-item" style="grid-column: 1 / -1">
      <div class="label">👁️ 视觉评分雷达图</div>
      <div class="visual-score-wrap">
        <canvas id="visualRadarCanvas" class="visual-radar-canvas" width="320" height="320"></canvas>
        <div class="value" style="font-size:0.82rem;line-height:1.8">
          UI/UX：<strong>${Number(mapped.ui_ux || 0).toFixed(1)}</strong> ·
          交互质量：<strong>${Number(mapped.interaction_quality || 0).toFixed(1)}</strong> ·
          转化可见性：<strong>${Number(mapped.conversion_visibility || 0).toFixed(1)}</strong><br>
          综合视觉分：<span style="color:var(--accent-5);font-weight:700">${Number(mapped.overall || 0).toFixed(1)}</span><br>
          置信度：${Number(visualScorecard.confidence || 0).toFixed(2)} · 截图数：${Number(visualScorecard.snapshot_count || 0)}
          ${findings.length ? `<br><span style="font-size:0.74rem;color:var(--text-secondary)">亮点: ${escapeHtml(findings.join('；'))}</span>` : ''}
          ${risks.length ? `<br><span style="font-size:0.74rem;color:#fca5a5">风险: ${escapeHtml(risks.join('；'))}</span>` : ''}
        </div>
      </div>
    </div>`;
  }

  // ⚡ Web Vitals 实测数据 (v2.0)
  if (data.web_vitals && Object.keys(data.web_vitals).length > 0) {
    const wv = data.web_vitals;
    let wvHtml = '';
    if (wv.lcp) wvHtml += 'LCP: ' + (wv.lcp/1000).toFixed(2) + 's · ';
    if (wv.fcp) wvHtml += 'FCP: ' + (wv.fcp/1000).toFixed(2) + 's · ';
    if (wv.cls !== undefined) wvHtml += 'CLS: ' + Number(wv.cls).toFixed(3) + ' · ';
    if (wv.long_tasks && wv.long_tasks.length > 0) wvHtml += 'Long Tasks: ' + wv.long_tasks.length + '个';
    if (wvHtml) {
      items += '<div class="info-item" style="grid-column: 1 / -1">' +
        '<div class="label">⚡ Web Vitals 实测 (v2)</div>' +
        '<div class="value" style="font-size:0.82rem;color:var(--accent-4)">' + wvHtml + '</div>' +
        '</div>';
    }
  }

  // 🎯 动画帧率 (v2.0)
  if (data.animation_fps && data.animation_fps.fps) {
    const fps = data.animation_fps.fps;
    const fpsColor = fps >= 55 ? 'var(--accent-5)' : fps >= 30 ? 'var(--accent-6)' : '#ef4444';
    items += '<div class="info-item" style="grid-column: 1 / -1">' +
      '<div class="label">🎯 动画帧率 FPS (v2)</div>' +
      '<div class="value" style="font-size:0.82rem;color:' + fpsColor + ';font-weight:700">' +
      fps + ' FPS (' + data.animation_fps.total_frames + ' 帧 / ' + (data.animation_fps.duration_ms/1000).toFixed(1) + 's)' +
      '</div></div>';
  }

  // 🔍 动画性能问题 (v2.0)
  if (data.animation_audit && data.animation_audit.issues && data.animation_audit.issues.length > 0) {
    const issues = data.animation_audit.issues;
    let issueHtml = '';
    issues.slice(0, 5).forEach(issue => {
      const icon = issue.severity === 'high' ? '🔴' : '🟡';
      issueHtml += icon + ' ' + issue.type.replace(/_/g, ' ') + ': ' + (issue.count || issue.element || issue.property || '') + '<br>';
    });
    items += '<div class="info-item" style="grid-column: 1 / -1">' +
      '<div class="label">🔍 动画性能审计 (v2)</div>' +
      '<div class="value" style="font-size:0.78rem;color:#fca5a5">' + issueHtml + '</div>' +
      '</div>';
  }

  // 🎨 CSS @keyframes 提取 (v2.0)
  if (data.css_keyframes_count && data.css_keyframes_count > 0) {
    items += `<div class="info-item" style="grid-column: 1 / -1">
      <div class="label">🎨 CSS @keyframes 提取 (v2)</div>
      <div class="value" style="font-size:0.82rem;color:var(--accent-4)">
        从外部 CSS 文件中检测到 <strong>${data.css_keyframes_count}</strong> 个 @keyframes 动画定义
      </div>
    </div>`;
  }

  // HTTP 响应头（技术向展示）
  if (data.response_headers) {
    try {
      const headers = JSON.parse(data.response_headers);
      const headerKeys = Object.keys(headers);
      if (headerKeys.length > 0) {
        items += `<div class="info-item" style="grid-column: 1 / -1;max-height:200px;overflow-y:auto">
          <div class="label">🔍 HTTP 响应头</div>
          <div style="font-size:0.75rem;font-family:monospace;line-height:1.6;color:var(--text-muted);margin-top:4px">
            ${headerKeys.map(k => `<span style="color:var(--accent-4)">${escapeHtml(k)}</span>: ${escapeHtml(String(headers[k]).slice(0, 100))}`).join('<br>')}
          </div>
        </div>`;
      }
    } catch(e) {}
  }

  grid.innerHTML = items;
  if (visualScorecard && visualScorecard.available && visualScorecard.mapped_scores) {
    drawVisualRadar('visualRadarCanvas', visualScorecard.mapped_scores);
  }
  setTimeout(() => {
    grid.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }, 100);
}

function drawVisualRadar(canvasId, mappedScores) {
  const canvas = document.getElementById(canvasId);
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  if (!ctx) return;

  const labels = ['UI/UX', '交互质量', '转化可见性'];
  const values = [
    Number(mappedScores.ui_ux || 0),
    Number(mappedScores.interaction_quality || 0),
    Number(mappedScores.conversion_visibility || 0),
  ];

  const w = canvas.width;
  const h = canvas.height;
  const cx = w / 2;
  const cy = h / 2;
  const maxR = Math.min(w, h) * 0.34;
  const rings = 5;

  ctx.clearRect(0, 0, w, h);

  // 背景环网格
  for (let i = 1; i <= rings; i++) {
    const r = (maxR * i) / rings;
    ctx.beginPath();
    for (let a = 0; a < labels.length; a++) {
      const rad = (-Math.PI / 2) + (a * 2 * Math.PI / labels.length);
      const x = cx + Math.cos(rad) * r;
      const y = cy + Math.sin(rad) * r;
      if (a === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }
    ctx.closePath();
    ctx.strokeStyle = 'rgba(152,152,184,0.25)';
    ctx.lineWidth = 1;
    ctx.stroke();
  }

  // 轴线与标签
  for (let a = 0; a < labels.length; a++) {
    const rad = (-Math.PI / 2) + (a * 2 * Math.PI / labels.length);
    const x = cx + Math.cos(rad) * maxR;
    const y = cy + Math.sin(rad) * maxR;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(x, y);
    ctx.strokeStyle = 'rgba(167,139,250,0.35)';
    ctx.stroke();

    const lx = cx + Math.cos(rad) * (maxR + 18);
    const ly = cy + Math.sin(rad) * (maxR + 18);
    ctx.fillStyle = '#c4b5fd';
    ctx.font = '12px Segoe UI, Arial, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(labels[a], lx, ly);
  }

  // 数据多边形
  ctx.beginPath();
  for (let a = 0; a < values.length; a++) {
    const score = Math.max(0, Math.min(100, values[a]));
    const r = maxR * (score / 100);
    const rad = (-Math.PI / 2) + (a * 2 * Math.PI / values.length);
    const x = cx + Math.cos(rad) * r;
    const y = cy + Math.sin(rad) * r;
    if (a === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  }
  ctx.closePath();
  ctx.fillStyle = 'rgba(99,102,241,0.25)';
  ctx.strokeStyle = 'rgba(99,102,241,0.95)';
  ctx.lineWidth = 2;
  ctx.fill();
  ctx.stroke();
}

// ============================================================
//  报告渲染
// ============================================================
function renderReport(markdown) {
  const wrapper = $('reportWrapper');
  const content = $('reportContent');

  // 配置 marked 以支持代码高亮
  marked.setOptions({
    breaks: true,
    gfm: true,
  });

  // 使用 marked 渲染 Markdown
  content.innerHTML = marked.parse(markdown);

  // 代码语法高亮
  content.querySelectorAll('pre code').forEach((block) => {
    hljs.highlightElement(block);
  });

  // 表格响应式包裹
  content.querySelectorAll('table').forEach((table) => {
    const wrapper = document.createElement('div');
    wrapper.style.cssText = 'overflow-x: auto; -webkit-overflow-scrolling: touch;';
    table.parentNode.insertBefore(wrapper, table);
    wrapper.appendChild(table);
  });

  // 优化链接在新窗口打开
  content.querySelectorAll('a[href^="http"]').forEach((link) => {
    link.setAttribute('target', '_blank');
    link.setAttribute('rel', 'noopener noreferrer');
  });

  wrapper.classList.add('visible');
}

// ============================================================
//  报告操作
// ============================================================
function copyReport() {
  if (!currentReport) return;

  // 获取纯文本
  const tempDiv = document.createElement('div');
  tempDiv.innerHTML = $('reportContent').innerHTML;
  const plainText = tempDiv.textContent || tempDiv.innerText;

  navigator.clipboard.writeText(plainText).then(() => {
    showToast('✅ 报告已复制到剪贴板');
  }).catch(() => {
    showToast('❌ 复制失败，请手动复制');
  });
}

function downloadReport() {
  if (!currentReport) return;

  const blob = new Blob([currentReport], { type: 'text/markdown;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const domain = currentWebsiteData?.domain || 'website';
  const timestamp = new Date().toISOString().slice(0, 10);
  a.href = url;
  a.download = `analysis-${domain}-${timestamp}.md`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);

  showToast('📥 报告已下载');
}

function downloadAlertSummary() {
  if (!currentAlertSummary) {
    showToast('⚠️ 当前暂无变化告警数据可下载');
    return;
  }

  const blob = new Blob([JSON.stringify(currentAlertSummary, null, 2)], { type: 'application/json;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const domain = currentWebsiteData?.domain || 'website';
  const timestamp = new Date().toISOString().slice(0, 10);
  a.href = url;
  a.download = `alert-summary-${domain}-${timestamp}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);

  showToast('🚨 告警摘要已下载');
}

// ============================================================
//  Toast 提示
// ============================================================
function showToast(msg) {
  let toast = document.querySelector('.toast');
  if (!toast) {
    toast = document.createElement('div');
    toast.className = 'toast';
    toast.style.cssText = `
      position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
      background: var(--bg-card); color: var(--text-primary);
      padding: 12px 24px; border-radius: 30px; font-size: 0.9rem;
      border: 1px solid var(--border);
      box-shadow: 0 8px 30px rgba(0,0,0,0.4);
      z-index: 9999;
      animation: toastIn 0.3s ease, toastOut 0.3s ease 2s forwards;
      pointer-events: none;
    `;
    document.body.appendChild(toast);
  }

  toast.textContent = msg;
  toast.style.animation = 'none';
  toast.offsetHeight; // reflow
  toast.style.animation = 'toastIn 0.3s ease, toastOut 0.3s ease 2s forwards';
}

// 动态注入 toast 动画
const toastStyle = document.createElement('style');
toastStyle.textContent = `
  @keyframes toastIn { from { opacity: 0; transform: translateX(-50%) translateY(20px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }
  @keyframes toastOut { from { opacity: 1; transform: translateX(-50%) translateY(0); } to { opacity: 0; transform: translateX(-50%) translateY(-10px); } }
`;
document.head.appendChild(toastStyle);

// ============================================================
//  工具函数
// ============================================================
function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

// ============================================================
//  历史记录功能
// ============================================================
async function loadHistory() {
  const list = $('historyList');
  list.innerHTML = '<span style="color:var(--text-muted)">加载中...</span>';
  try {
    const res = await fetch('/api/history?limit=15', { headers: getAdminHeaders() });
    if (!res.ok) throw new Error('请求失败');
    const items = await res.json();
    if (!items.length) {
      list.innerHTML = '<span style="color:var(--text-muted)">暂无历史记录，完成一次分析后会自动保存。</span>';
      return;
    }
    list.innerHTML = items.map(item => {
      const techTags = Object.values(item.tech_stack || {})
        .flat().slice(0, 5)
        .map(t => `<span style="background:var(--surface-3,#2a2a3e);padding:1px 6px;border-radius:4px;font-size:0.7rem;margin-right:3px">${escapeHtml(t)}</span>`)
        .join('');
      return `
        <div style="padding:10px 0;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:flex-start">
          <div style="flex:1;cursor:pointer" onclick="loadHistoryItem(${item.id})">
            <div style="color:var(--text-primary);font-weight:600;margin-bottom:3px">${escapeHtml(item.domain || item.url)}</div>
            <div style="color:var(--text-muted);font-size:0.72rem;margin-bottom:4px">${escapeHtml(item.created_at)}</div>
            <div style="margin-bottom:4px">${techTags}</div>
            <div style="color:var(--text-secondary);font-size:0.75rem;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;max-width:600px">${escapeHtml((item.summary || '').slice(0, 120))}…</div>
          </div>
          <button onclick="deleteHistoryItem(${item.id},this)" style="margin-left:10px;background:none;border:1px solid var(--border);color:var(--text-muted);border-radius:6px;padding:3px 8px;cursor:pointer;font-size:0.7rem;white-space:nowrap" title="删除此记录">🗑 删除</button>
        </div>`;
    }).join('');
  } catch (e) {
    list.innerHTML = `<span style="color:#f87171">加载失败: ${e.message}</span>`;
  }
}

async function loadHistoryItem(id) {
  try {
    const res = await fetch(`/api/history/${id}`, { headers: getAdminHeaders() });
    if (!res.ok) throw new Error('请求失败');
    const item = await res.json();
    currentReport = item.report;
    renderReport(item.report);
    $('reportWrapper').classList.add('visible');
    $('reportWrapper').scrollIntoView({ behavior: 'smooth', block: 'start' });
    showToast('✅ 已加载历史报告');
  } catch (e) {
    showToast(`❌ 加载失败: ${e.message}`);
  }
}

async function deleteHistoryItem(id, btn) {
  if (!confirm('确定删除此条历史记录？')) return;
  try {
    const res = await fetch(`/api/history/${id}`, { method: 'DELETE', headers: getAdminHeaders() });
    if (!res.ok) throw new Error('删除失败');
    showToast('🗑 已删除');
    loadHistory();
  } catch (e) {
    showToast(`❌ ${e.message}`);
  }
}

// 初始化本地保存报告搜索监听
$('localReportKeyword')?.addEventListener('input', () => {
  loadLocalReports();
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    closeLocalReportModal();
  }
});
