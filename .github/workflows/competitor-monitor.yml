name: Competitor Monitor

on:
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:
    inputs:
      url:
        description: "Primary URL"
        required: false
        default: "https://diamondrosesanctuary.com"
      compare_url:
        description: "Compare URL (optional)"
        required: false
        default: ""
      mode:
        description: "quick or standard"
        required: false
        default: "quick"
      alert_threshold:
        description: "change alert threshold (0-1)"
        required: false
        default: "0.35"
      on_high:
        description: "action for high (none|warn|issue|fail)"
        required: false
        default: "issue"
      on_medium:
        description: "action for medium (none|warn|issue|fail)"
        required: false
        default: "warn"
      on_low:
        description: "action for low (none|warn|issue|fail)"
        required: false
        default: "none"
      enable_vision:
        description: "enable vision model (true|false)"
        required: false
        default: "false"
      interaction_level:
        description: "interaction level (off|basic|standard)"
        required: false
        default: "standard"
      vision_max_images:
        description: "max images for vision model (1-8)"
        required: false
        default: "3"
      click_whitelist:
        description: "click whitelist (true|false)"
        required: false
        default: "true"

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browser (standard mode only)
        if: ${{ github.event.inputs.mode == 'standard' }}
        run: |
          python -m playwright install chromium

      - name: Run analysis CLI
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          URL_INPUT: ${{ github.event.inputs.url }}
          COMPARE_URL_INPUT: ${{ github.event.inputs.compare_url }}
          MODE_INPUT: ${{ github.event.inputs.mode }}
          ALERT_THRESHOLD_INPUT: ${{ github.event.inputs.alert_threshold }}
          ON_HIGH_INPUT: ${{ github.event.inputs.on_high }}
          ON_MEDIUM_INPUT: ${{ github.event.inputs.on_medium }}
          ON_LOW_INPUT: ${{ github.event.inputs.on_low }}
          ENABLE_VISION_INPUT: ${{ github.event.inputs.enable_vision }}
          INTERACTION_LEVEL_INPUT: ${{ github.event.inputs.interaction_level }}
          VISION_MAX_IMAGES_INPUT: ${{ github.event.inputs.vision_max_images }}
          CLICK_WHITELIST_INPUT: ${{ github.event.inputs.click_whitelist }}
        run: |
          python - <<'PY'
          import os
          import subprocess

          url = (os.getenv('URL_INPUT') or 'https://diamondrosesanctuary.com').strip()
          compare_url = (os.getenv('COMPARE_URL_INPUT') or '').strip()
          mode = (os.getenv('MODE_INPUT') or 'quick').strip()
          alert_threshold = (os.getenv('ALERT_THRESHOLD_INPUT') or '0.35').strip()
          on_high = (os.getenv('ON_HIGH_INPUT') or 'issue').strip()
          on_medium = (os.getenv('ON_MEDIUM_INPUT') or 'warn').strip()
          on_low = (os.getenv('ON_LOW_INPUT') or 'none').strip()
          enable_vision = (os.getenv('ENABLE_VISION_INPUT') or 'false').strip().lower()
          interaction_level = (os.getenv('INTERACTION_LEVEL_INPUT') or 'standard').strip().lower()
          vision_max_images = (os.getenv('VISION_MAX_IMAGES_INPUT') or '3').strip()
          click_whitelist = (os.getenv('CLICK_WHITELIST_INPUT') or 'true').strip().lower()

          cmd = [
              'python', 'cli_analyze.py',
              '--url', url,
              '--mode', mode,
              '--alert-threshold', alert_threshold,
              '--alert-file', '结果/last-alert.json',
              '--on-high', on_high,
              '--on-medium', on_medium,
              '--on-low', on_low,
              '--interaction-level', interaction_level,
              '--vision-max-images', vision_max_images,
          ]

          if enable_vision in {'1', 'true', 'yes', 'y'}:
              cmd.append('--enable-vision')

          if click_whitelist in {'0', 'false', 'no', 'n'}:
              cmd.append('--no-click-whitelist')

          if compare_url:
              cmd.extend(['--compare-url', compare_url, '--no-ai'])
          elif os.getenv('DEEPSEEK_API_KEY'):
              pass
          else:
              cmd.append('--no-ai')

          print('Running:', ' '.join(cmd))
          subprocess.check_call(cmd)
          PY

      - name: Handle alert action
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const alertPath = '结果/last-alert.json';
            if (!fs.existsSync(alertPath)) {
              core.info('No alert file found, skip issue creation.');
              return;
            }
            const alert = JSON.parse(fs.readFileSync(alertPath, 'utf8'));
            const action = alert.selected_action || 'none';

            const body = [
              '自动监控检测到变化。',
              '',
              `- Severity: ${alert.severity}`,
              `- Action: ${action}`,
              `- Score: ${alert.change_score}`,
              `- Threshold: ${alert.threshold}`,
              '',
              '```json',
              JSON.stringify(alert, null, 2),
              '```',
            ].join('\n');

            if (action === 'issue') {
              const title = `🚨 Website change alert (${alert.severity}, score=${alert.change_score})`;
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['monitoring', 'change-alert', `severity-${alert.severity}`],
              });
              core.info('Issue created for alert action=issue');
            } else if (action === 'warn') {
              core.warning(body);
            } else if (action === 'fail') {
              core.setFailed(body);
            } else {
              core.info(`Alert action=${action}, no external action executed.`);
            }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: webinsight-results
          path: 结果/*
          if-no-files-found: warn





